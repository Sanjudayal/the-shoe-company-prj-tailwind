<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>the shoe company</title>
    <link rel="stylesheet" href="./src/output.css" />
  </head>
  <body class="bg-black text-white">
    <header
      class="flex justify-between items-center w-full px-10 lg:px-14 fixed `max-w-[1440px]` mx-auto"
    >
      <div id="logo">
        <img class="w-18 lg:w-23" src="/images/logo.png" alt="logo" />
      </div>
      <nav class="hidden md:block space-x-6 lg:space-x-9 font-bold lg:text-xl">
        <a href="#">Home</a>
        <a href="#">How It Works?</a>
        <a href="#">About</a>
        <a href="#">Testimonials</a>
        <a href="#">Contact Us</a>
      </nav>
      <button class="text-4xl md:hidden">≡</button>
    </header>

    <section
      id="hero"
      class="h-screen bg-[url(/images/road-background.png)] bg-no-repeat bg-top-right bg-contain bg-`[length:50%_100%]` `max-w-[1440px]` mx-auto" 
    >
      <div
        class="flex justify-between items-center h-full pt-15 max-w-6xl mx-auto"
      >
        <h1 class="text-7xl font-bold leading-tight self-center ml-15 mt-10">
          THE <br />
          SHOE <br />
          COMPANY
        </h1>
        <div class="max-w-xl">
          <img
            class="max-w-full pr-8"
            src="/images/the-white-shoe-hero-image 1@2x.png"
            alt="shoe-png"
          />
        </div>
      </div>
    </section>
  </body>
</html>
