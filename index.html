<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>the shoe company</title>
    <link rel="stylesheet" href="./src/output.css" />

  <body class="bg-black text-white">
    <div class="w-full fixed top-0 left-0 right-0 z-50">
      <header
        class="flex justify-between items-center max-w-[1440px] mx-auto px-10 lg:px-14"

        <div id="logo">
          <img class="w-18 lg:w-23" src="/images/logo.png" alt="logo" />

        <nav

    <section

        class="flex justify-between items-center h-full pt-15 max-w-6xl mx-auto"

        <h1 class="text-7xl font-bold leading-tight self-center ml-15 mt-10">

        <div class="max-w-xl">
